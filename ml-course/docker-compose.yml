services:
  mlflow:
    build: .
    command:
      [
        "mlflow",
        "server",
        "--host",
        "0.0.0.0",
        "--port",
        "5000",
        "--backend-store-uri",
        "sqlite:////srv/mlruns/mlflow.db",
        "--default-artifact-root",
        "/srv/mlartifacts"
      ]
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/srv/mlruns
      - ./mlartifacts:/srv/mlartifacts
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/health"]
      interval: 5s
      timeout: 3s
      retries: 15

  fraud-api:
    build: .
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ARTIFACTS_DIR: /srv/artifacts
      DATA_PATH: /srv/data/transactions.csv
      PARAMS_PATH: /srv/params.yaml
      FAULT_STATE_PATH: /srv/.fault_state.json
    ports:
      - "8000:8000"
    volumes:
      - ./data:/srv/data
      - ./artifacts:/srv/artifacts
      - ./mlruns:/srv/mlruns
      - ./.fault_state.json:/srv/.fault_state.json
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 15
