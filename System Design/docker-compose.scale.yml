# Scaling override: spins up 3 stateless application replicas behind load balancer
services:
  gateway:
    volumes:
      - ./gateway/nginx.scale.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-1
      - api-2
      - api-3

  api-1:
    build: ./api
    environment:
      HOSTNAME: replica-node-1
      DATABASE_URL: sqlite:////data/urlshortener.db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - shared_data:/data
    depends_on:
      - redis

  api-2:
    build: ./api
    environment:
      HOSTNAME: replica-node-2
      DATABASE_URL: sqlite:////data/urlshortener.db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - shared_data:/data
    depends_on:
      - redis

  api-3:
    build: ./api
    environment:
      HOSTNAME: replica-node-3
      DATABASE_URL: sqlite:////data/urlshortener.db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - shared_data:/data
    depends_on:
      - redis
