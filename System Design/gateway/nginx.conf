# Nginx Load Balancer and Gateway for System Design
# Demonstrates:
# - Reverse proxying and request routing
# - Horizontal load balancing (round-robin / least_conn)
# - Traceability with X-Request-Id and upstream address inspection
# - Rate limiting (Token bucket pattern returning 429)

resolver 127.0.0.11 valid=5s ipv6=off;

log_format traced '$remote_addr rid=$request_id upstream=$upstream_addr "$request" $status';
access_log /dev/stdout traced;

# Rate limiting zone: 10 requests per minute per client IP
limit_req_zone $binary_remote_addr zone=api_limit:1m rate=10r/m;
limit_req_status 429;

upstream backend_servers {
    server api:8000;
}

server {
    listen 8080;

    # Inject distributed tracing request-id
    add_header X-Request-Id $request_id always;
    add_header X-Handled-By $upstream_addr always;

    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;

    location / {
        proxy_pass http://backend_servers;
    }

    # Rate limiting demonstration endpoint
    location /api/limited {
        limit_req zone=api_limit burst=3 nodelay;
        proxy_pass http://backend_servers/health;
    }

    error_page 429 = @too_many_requests;
    location @too_many_requests {
        default_type application/json;
        add_header Retry-After 6 always;
        add_header X-Request-Id $request_id always;
        return 429 '{"error": "rate_limit_exceeded", "message": "Too many requests. Please slow down and retry in 6 seconds.", "retry_after_seconds": 6}\n';
    }
}
