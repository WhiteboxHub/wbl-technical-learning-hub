services:
  redis:
    image: redis:7-alpine
    container_name: sd-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: ./api
    container_name: sd-api
    environment:
      DATABASE_URL: sqlite:////data/urlshortener.db
      REDIS_URL: redis://redis:6379/0
      NO_CACHE: "0"
      SIMULATE_DB_DELAY: "0.0"
      CACHE_TTL_SECONDS: "60"
    ports:
      - "8000:8000"
    volumes:
      - shared_data:/data
    depends_on:
      - redis

  worker:
    build: ./worker
    container_name: sd-worker
    environment:
      DATABASE_URL: /data/urlshortener.db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - shared_data:/data
    depends_on:
      - redis
      - api

  gateway:
    image: nginx:alpine
    container_name: sd-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  shared_data:
  redis_data:
