services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: hr_dev_password
      POSTGRES_DB: hr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr -d hr"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://hr:hr_dev_password@db:5432/hr
      DEMO_PASSWORD: ${DEMO_PASSWORD:-hrdemo-local-only}   # dev-only password for the demo users (Module 4)
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-not-for-production-use-0123456789}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  gateway:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["sso"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${DEMO_PASSWORD:-hrdemo-local-only}
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/hr-realm.json:/opt/keycloak/data/import/hr-realm.json:ro

  portal:
    build: ./sso-app
    profiles: ["sso"]
    environment:
      CLIENT_ID: portal
      PORT: "3001"
    ports:
      - "3001:3001"
    depends_on:
      - keycloak

  payroll:
    build: ./sso-app
    profiles: ["sso"]
    environment:
      CLIENT_ID: payroll
      PORT: "3002"
    ports:
      - "3002:3002"
    depends_on:
      - keycloak

  vuln:
    build: ./vuln
    ports:
      - "3003:3003"

  web:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro

volumes:
  pgdata:
