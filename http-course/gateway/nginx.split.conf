# SPLIT variant of the gateway (Module 7): employees and departments go to separate services.
# API gateway for the course (Module 6). nginx in front of the HR API.
# Re-resolves "api" through Docker DNS so it survives API restarts.
resolver 127.0.0.11 valid=5s ipv6=off;

# Access log with the request id, so one request can be followed across services (Modules 6-8).
log_format traced '$remote_addr rid=$request_id "$request" $status';
access_log /dev/stdout traced;

# Rate limit demo: 5 requests per minute per client IP.
limit_req_zone $binary_remote_addr zone=demo:1m rate=5r/m;
limit_req_status 429;

server {
    listen 8080;
    client_max_body_size 1m;                       # request size limit

    # Every response carries the request id; the same id is sent upstream.
    add_header X-Request-Id $request_id always;
    proxy_set_header X-Request-Id $request_id;
    proxy_hide_header X-Request-Id;                 # avoid a duplicate when a service echoes it
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;

    set $api http://api:8000;
    set $emp http://employees-service:8000;
    set $dept http://departments-service:8000;

    location = /health {
        proxy_pass $api;
    }

    # --- rate limiting demo: first 5 requests pass, then 429 + Retry-After
    location = /v2/limited {
        limit_req zone=demo burst=4 nodelay;
        add_header X-Request-Id $request_id always;
        proxy_pass $api/health;
    }
    error_page 429 = @too_many;
    location @too_many {
        default_type application/json;
        add_header Retry-After 12 always;
        add_header X-Request-Id $request_id always;
        return 429 '{"detail":"rate limit exceeded; retry after 12 seconds"}\n';
    }

    # --- versioning: /v1 is deprecated and routed to the same service
    location /v1/ {
        rewrite ^/v1/(.*)$ /v2/$1 break;
        add_header Deprecation "true" always;
        add_header Sunset "Thu, 31 Dec 2026 23:59:59 GMT" always;
        add_header Link '</v2/>; rel="successor-version"' always;
        add_header X-Request-Id $request_id always;
        proxy_pass $api;
    }

    # --- auth at the edge: no token, no entry (the service still checks roles)
    location /secure/ {
        if ($http_authorization = "") {
            add_header X-Request-Id $request_id always;
            return 401 '{"detail":"gateway: missing Authorization header"}\n';
        }
        rewrite ^/secure/(.*)$ /v2/$1 break;
        proxy_pass $api;
    }

    # --- Module 7 routing: each path prefix belongs to one service
    location /v2/employees {
        proxy_pass $emp;
    }
    location /v2/departments {
        proxy_pass $dept;
    }

    location / {
        proxy_pass $api;
    }
}
