[project]
name = "claimflow"
version = "1.0.0"
description = "ClaimFlow AI - Production Healthcare Claims & Prior-Auth Agentic Platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "pytest>=8.1.1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"
