version: '3.8'

services:
  claimflow-api:
    build: .
    container_name: claimflow-service
    ports:
      - "8000:8000"
    environment:
      - CLAIMFLOW_LLM_PROVIDER=mock
      - CLAIMFLOW_TENANT=tenant-health-corp
    volumes:
      - ./claimflow:/app/claimflow
      - ./web:/app/web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
