services:
  unix:
    build:
      context: ./docker
      dockerfile: Dockerfile
    image: wbl-unix-lab:ubuntu-24.04
    container_name: wbl-unix
    hostname: wbl-unix-box
    ports:
      - "8085:8080"
    volumes:
      - unix_lab_data:/workspace/training_lab
    init: true
    healthcheck:
      test: ["CMD-SHELL", "test -f /workspace/training_lab/.seeded && pgrep -f 'http.server 8080' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  unix_lab_data:
