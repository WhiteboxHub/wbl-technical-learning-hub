services:
  vector-db:
    image: chromadb/chroma:0.5.23
    ports:
      - "8001:8000"
    volumes:
      - chromadata:/chroma/chroma
    environment:
      CHROMA_SERVER_HOST: 0.0.0.0
      IS_PERSISTENT: "TRUE"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      CHROMA_HOST: vector-db
      CHROMA_PORT: "8000"
    depends_on:
      vector-db:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro

  ui:
    build: ./ui
    ports:
      - "3000:8501"
      - "8501:8501"
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
    volumes:
      - ./ui:/app
    depends_on:
      - api

volumes:
  chromadata:
