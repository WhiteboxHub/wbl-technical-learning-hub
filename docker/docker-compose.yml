services:
  redis:
    image: redis:7-alpine
    container_name: harbor-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - harbor-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: harbor-api
    ports:
      - "8000:8000"
    environment:
      PORT_NAME: "Port of Rotterdam"
      MANIFEST_DB_PATH: "/data/manifest.db"
      REDIS_URL: "redis://redis:6379/0"
    volumes:
      - cargo-data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - harbor-net

volumes:
  cargo-data:
    name: cargo-data
  redis-data:
    name: redis-data

networks:
  harbor-net:
    name: harbor-net
    driver: bridge
